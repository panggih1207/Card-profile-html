<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CArd Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 flex items-center justify-center min-h-screen">
    <div class="max-w-sm bg-white rounded-2xl shadow-lg p-6 text-center hover:shadow-2xl transition duration-300">
        <!-- foto -->
         <img 
         src="https://i.pravatar.cc/150?img=12" 
         alt="Foto Profil"
         class="w-24 h-24 mx-auto rounded-full border-4 border-blue-500 object-cover">

         <!-- Nama -->
     <h2 class="mt-4 text-xl font-bold text-gray-800">
      Panggi Developer
     </h2>
     
      <!-- Role -->
    <p class="text-gray-500 text-sm">
      Full Stack Developer
    </p>

    <!-- Deskripsi -->
    <p class="mt-3 text-gray-600 text-sm">
      Fokus pada pengembangan web modern menggunakan React, Node.js, dan Tailwind CSS.
    </p>

    <!-- Button -->
    <div class="mt-5 flex justify-center gap-3">
      <button class="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition">
        Follow
      </button>
      <button class="border border-gray-300 px-4 py-2 rounded-xl hover:bg-gray-100 transition">
        Message
      </button>
    </div>

    </div>
</body>
</html>
